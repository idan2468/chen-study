<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>מרכז תרגול אנגלית - Chen Studying</title>
    <!-- The hub page's own icon (📚), inlined so no asset file or `public/`
         directory is needed. Without this, every load 404s on /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the saved colour scheme before first paint to avoid a flash.
      // Reads the legacy `dark_mode_enabled` ('1'/'0') key that the original
      // HTML apps wrote, which `colorSchemeManager` in src/theme.ts also uses.
      try {
        var saved = window.localStorage.getItem("dark_mode_enabled")
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          saved === "0" ? "light" : "dark",
        )
      } catch (e) {
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          "dark",
        )
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
